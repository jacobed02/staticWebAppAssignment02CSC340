<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Request</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header id="header">
        <h1>Character Request</h1>
    </header>
    <form class="search-container">
        <input type="text" placeholder="Search..." name="search" class="search-input">
        <button type="submit" class="search-btn">Search
        </button>
    </form>
    <nav id="nav">
        <div id="buttons">
            <a href="index.html">
                <button class="button">Homepage</button>
            </a>
            <a href="details.html">
                <button class="button">Spongebob Details</button>
            </a>
            <a href="about.html">
                <button class="button">About Us</button>
            </a>
            <a href="new-character-form.html">
                <button class="button">Character Request</button>
            </a>
        </div>
    </nav>
    <hr>
    <main id="main">
        <h2>Request a New Character</h2>
        <form id="character-form">
            <div class="form-field">
                <label for="character-name">Name</label>
                <input type="text" id="character-name" name="name" required>
            </div>
            <div class="form-field">
                <label for="character-universe">Universe</label>
                <input type="text" id="character-universe" name="universe" required>
            </div>
            <div class="form-field">
                <label for="character-role">Role</label>
                <input type="text" id="character-role" name="role" required>
            </div>
            <div class="form-field">
                <label for="character-image">Image URL</label>
                <input type="url" id="character-image" name="image-url" placeholder="https://example.com/image.jpg" required>
            </div>
            <div class="form-field">
                <label for="character-description">Short Description</label>
                <textarea id="character-description" name="description" rows="5" required></textarea>
            </div>
            <button type="submit" class="form-submit">Submit Character</button>
        </form>
    </main>

</body>

</html>
